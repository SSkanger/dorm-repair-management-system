{% extends 'base.html' %}

{% block content %}
<section class="page-heading">
  <p class="eyebrow">身份已验证</p>
  <h1>{{ role_title }}</h1>
  <p class="lead">你好，{{ g.user['display_name'] }}。当前登录账号为 <strong>{{ g.user['username'] }}</strong>。</p>

<section class="empty-state">
